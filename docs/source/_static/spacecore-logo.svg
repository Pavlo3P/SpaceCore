    <path d="M341 50 344 49Q351 49 351 56L352 89 341 108 353 272H345L333 107 344 87Z" fill="#7F9EB5" stroke="none"/>
    <path d="M329 272 321 108 309 90 308 57Q308 50 315 50L344 49Q351 49 351 56L352 89 341 108 353 272Z" fill="none"/>
    <path d="M322 62 323 83" stroke="#FFF" stroke-width="6"/>
