    <path d="M341 271 401 113Q420 71 451 57Q458 55 456 65L439 161Q437 172 431 182L377 286Z" fill="#D8E6EF"/>
    <!-- Shading follows the outer contour; the outline is painted last. -->
    <path d="M456 65 439 161Q437 172 431 182L377 286 366 281 420 177Q426 167 428 155Z" fill="#9BB6C9" stroke="none"/>
    <path d="M341 271 401 113Q420 71 451 57Q458 55 456 65L439 161Q437 172 431 182L377 286Z" fill="none"/>
