<svg xmlns="http://www.w3.org/2000/svg" width="440" height="410" viewBox="0 0 440 410" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">SpaceCore — cartoon logo</title>
  <desc id="desc">A subtly three-dimensional cartoon red Swiss Army knife, tilted with its larger left end closer and lower and its right end farther and higher, with a silver blade, screwdriver, and turquoise stepped descent arrow. White gradient notation, nabla f of x subscript k, decorates the handle. No wordmark.</desc>
  <g transform="translate(-62 8) rotate(-12 280 220)" stroke="#253043" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
