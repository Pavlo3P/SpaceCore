    <path d="M272 233 359 281 348 298 263 249Z" fill="#B6CEDD" stroke-width="7"/>
    <path d="M128 190H172V207H216V224H259L279 244" stroke-width="24"/>
    <path d="M128 190H172V207H216V224H259L279 244" stroke="#61D4C5" stroke-width="11"/>
    <path d="m260 244 23 3-3-23" stroke-width="20"/>
    <path d="m260 244 23 3-3-23" stroke="#61D4C5" stroke-width="8"/>
    <!-- Tapered casing: a larger near end and a smaller far end. -->
    <!-- Offset rear shell and metal liner reveal the handle thickness. -->
    <path d="M161 249 353 261C380 263 400 277 400 298S380 336 353 338L161 350C126 352 103 330 103 300S126 247 161 249Z" transform="translate(-5 13)" fill="#A82F45"/>
    <path d="M161 249 353 261C380 263 400 277 400 298S380 336 353 338L161 350C126 352 103 330 103 300S126 247 161 249Z" transform="translate(-2 6)" fill="#9DB2C4" stroke-width="6"/>
    <path d="M161 249 353 261C380 263 400 277 400 298S380 336 353 338L161 350C126 352 103 330 103 300S126 247 161 249Z" fill="#F5555D"/>
    <path d="M122 322Q137 343 165 340L350 329Q376 328 387 313" stroke="#D93447" stroke-width="9"/>
    <path d="M326 272 361 275" stroke="#FFB8AC" stroke-width="8"/>
    <circle cx="355" cy="298" r="17" fill="#B6CEDD" stroke-width="7"/>
    <path d="m350 303 10-10" stroke-width="5"/>
